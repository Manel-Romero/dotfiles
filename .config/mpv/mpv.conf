hwdec=auto-safe
vo=gpu-next

alang=es,spa,spanish,en,eng
slang=es,spa,spanish,en,eng

save-position-on-quit=yes
keep-open=yes
autofit=70%

gpu-api=vulkan
profile=high-quality

[upscale-ia-bajas-res]
profile-desc=Escalado con IA solo para resoluciones menores a 720p reales
profile-cond=height < 720 and width < 1280
profile-restore=copy
glsl-shaders-append="~/.config/mpv/shaders/FSRCNNX_x2_16-0-4-1.glsl"
