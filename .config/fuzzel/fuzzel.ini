[main]
# --- TIPOGRAFÍA Y PROMPT ---
font=JetBrainsMono Nerd Font:size=13
prompt="   " 

# --- ICONOS ---
icons-enabled=no

# --- DIMENSIONES Y ESPACIADO ---
lines=8
width=45
horizontal-pad=24
vertical-pad=24
inner-pad=12
line-height=30

# --- COMPORTAMIENTO ---
terminal=kitty -e
exit-on-keyboard-focus-loss=yes

[border]
# --- BORDES Y ESQUINAS ---
width=2
radius=3

[colors]
# --- PALETA INTEGRADA ---
background=181a20e6
text=e8e8d8ff
match=ff9e64ff

selection=d45c5bff
selection-text=181a20ff
selection-match=c0caf5ff

border=e8e8d8ff
